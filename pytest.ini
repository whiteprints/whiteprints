[pytest]
addopts =
  --numprocesses=auto
  --durations=5
  --cov
  --cov-append
  --cov-context=test
  --cov-report=term-missing:skip-covered
  --no-cov-on-fail
  --cov-fail-under=0
  --xdoctest
  --xdoctest-colored=XDOCTEST_COLORED
  --strict-config
  --strict-markers
  --md-report
  --md-report-exclude-outcomes passed skipped xpassed

markers =
    only_extras: mark a test that should only be tested with extra dependencies
    no_extras: mark a test that should be tested without extra dependencies.
    extras_and_no_extras: mark a test that should be tested with and without extra dependencies.
    slow: mark test as slow.

junit_family = legacy
xfail_strict = true
filterwarnings =
  # When running tests, treat warnings as errors (e.g. -Werror). See:
  # https://docs.pytest.org/en/latest/reference/reference.html#confval-filterwarnings
  error
  # Add additional warning supressions as needed here. For example, if a
  # third-party library is throwing a deprecation warning that needs to be
  # fixed upstream.
