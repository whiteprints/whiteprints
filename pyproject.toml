[build-system]
build-backend = "hatchling.build"
requires = [
    "hatch-fancy-pypi-readme>=24.1",
    "hatch-vcs>=0.4",
    "hatchling>=1.27",
]

[project]
name = "whiteprints"
description = "A Copier-based cookiecutter for creating Python projects managed by uv."
keywords = [
    "Python",
]
license = "GPL-3.0-or-later"
license-files = [
    "LICENSES/GPL-3.0-or-later.txt",
]
maintainers = [
    { name = "Romain Brault", email = "whiteprints@pm.me" },
]
authors = [
    { name = "Romain Brault", email = "whiteprints@pm.me" },
]
requires-python = ">=3.12,<4.0"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Framework :: Pytest",
    "Framework :: Sphinx",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dynamic = [
    "readme",
    "version",
]
dependencies = [
    "copier==9.9.0",
    "typing-extensions==4.14.1; python_full_version<'3.13.0'",
    "whiteprints-template-context==0.6.0",
]
optional-dependencies.autocompletion = [
    "argcomplete==3.6.2",
]
optional-dependencies.color = [
    "rich==14.1.0",
    "rich-argparse==1.7.1",
]
optional-dependencies.debug = [
    "beartype==0.21.0",
]
optional-dependencies.environment = [
    "platformdirs==4.3.8",
]
optional-dependencies.profile = [
    "functiontrace==0.5.0",
]
optional-dependencies.qol = [
    "whiteprints[autocompletion]",
    "whiteprints[environment]",
    "whiteprints[shell-detection]",
]
optional-dependencies.shell-detection = [
    "shellingham==1.5.4",
]
urls.changelog = "https://github.com/whiteprints/whiteprints/releases"
urls.discussions = "https://github.com/whiteprints/whiteprints/discussions"
urls.documentation = "https://github.com/whiteprints/whiteprints"
urls.download = "https://github.com/whiteprints/whiteprints/releases"
urls.homepage = "https://github.com/whiteprints/whiteprints"
urls.integration = "https://github.com/whiteprints/whiteprints/actions"
urls.issues = "https://github.com/whiteprints/whiteprints/issues"
urls.pypi = "https://pypi.org/project/whiteprints"
urls.repository = "https://github.com/whiteprints/whiteprints"

scripts.whiteprints = "whiteprints.cli.cli_entrypoint:entrypoint"

[dependency-groups]
dev = [
    { include-group = "audit-maintainability" },
    { include-group = "audit-vulnerabilities" },
    { include-group = "build-documentation" },
    { include-group = "check-exceptions" },
    { include-group = "check-maintainability" },
    { include-group = "check-vulnerabilities" },
    { include-group = "coverage" },
    { include-group = "editor" },
    { include-group = "localization" },
    { include-group = "serve-documentation" },
    { include-group = "tests" },
]

build-documentation = [
    "myst-parser[linkify]==4.0.1",
    "pydata-sphinx-theme==0.16.1",
    "sphinx==8.2.3",
    "sphinx-argparse==0.5.2",
    "sphinx-autoapi==3.6.0",
    "sphinx-copybutton==0.5.2",
    "sphinxcontrib-napoleon==0.7.0",
    "sphinxcontrib-spelling==8.0.1",
    "stdlib-list>=0.11.1",
]
tests = [
    "beartype==0.21.0",
    "hypothesis==6.135.14",
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "pytest-html==4.1.1",
    "pytest-md-report==0.7.0",
    "pytest-randomly==3.16.0",
    "pytest-xdist==3.7.0",
    "xdoctest[colors]==1.2.0",
]
editor = [
    "pynvim==0.5.2",
]
coverage = [
    "coverage==7.9.1",
]
audit-vulnerabilities = [
    "pip-audit==2.9.0",
]
audit-maintainability = [
    "radon==6.0.1",
]
check-exceptions = [
    "tryceratops==2.4.1",
]
check-maintainability = [
    "xenon==0.9.3",
]
check-vulnerabilities = [
    "bandit==1.8.5",
]
serve-documentation = [
    "sphinx-autobuild==2024.10.3",
    { include-group = "build-documentation" },
]
localization = [
    "babel==2.17.0",
]

[tool.pyproject-fmt]
column_width = 79
indent = 4
keep_full_version = true
max_supported_python = "3.13"

[tool.uv]
required-version = ">=0.8.4"
cache-keys = [
    { git = { commit = true, tags = true } },
    { file = "src/**/*.py" },
    { file = "src/**/*.po" },
    { file = "src/**/*.pot" },
    { file = "pyproject.toml" },
    { file = "uv.toml.py" },
    { file = "hatch.toml" },
    { file = "hatch_build.py" },
    { file = "*.md" },
    { file = "uv.lock" },
]
